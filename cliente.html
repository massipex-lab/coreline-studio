<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#96a387">
<title>Coreline Pilates — La tua area (v1.7)</title>
<!-- cliente.html v1.7 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── RESET & VARS ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#96a387;--green-d:#7a8d6c;--green-l:#EBF0E6;--green-m:#a8ae9d;
  --cl-light:#c6cbbf;--cl-mid:#a8ae9d;--cl-dark:#96a387;
  --ok:#2E7D32;--ok-l:#E8F5E9;
  --red:#C62828;--red-l:#FFEBEE;
  --warn:#E65100;--warn-l:#FFF3E0;
  --blue:#1565C0;--blue-l:#E3F2FD;
  --bg:#F7F3F7;--border:#E8E0E8;--white:#fff;
  --text:#3a3a3a;--muted:#888;
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --nav-h:64px;
}
html,body{height:100%;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;overflow-x:hidden}

/* ── LOGIN ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px;background:var(--cl-light)}
.login-logo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:42px;color:#fff;letter-spacing:4px;text-transform:lowercase;margin-bottom:4px}
.login-logo span{display:inline-block;width:20px;height:20px;border:1.5px solid #fff;border-radius:50%;vertical-align:middle;margin:0 2px -3px}
.login-sub{font-size:10px;color:#fff;letter-spacing:4px;text-transform:uppercase;opacity:.8;margin-bottom:40px}
.login-box{background:#fff;border-radius:var(--r-lg);padding:28px 24px 32px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.login-box h2{font-size:17px;font-weight:700;color:var(--cl-dark);margin-bottom:4px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field select,.field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;background:#fff;color:var(--text);outline:none;-webkit-appearance:none;transition:border .15s;font-family:inherit}
.field select:focus,.field input:focus{border-color:var(--cl-dark)}
.btn-login{width:100%;padding:14px;background:var(--cl-dark);color:#fff;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;transition:background .15s}
.btn-login:active{background:var(--green-d)}
.login-note{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative}

/* ── TOPBAR ── */
.topbar{background:var(--cl-mid);color:#fff;padding:14px 16px 12px;flex-shrink:0}
.topbar-row{display:flex;justify-content:space-between;align-items:center}
.topbar-logo{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:20px;color:#fff;letter-spacing:3px;text-transform:lowercase}
.topbar-logo span{display:inline-block;width:12px;height:12px;border:1.5px solid #fff;border-radius:50%;vertical-align:middle;margin:0 1px -2px}
.topbar-user{font-size:13px;font-weight:600;color:#fff;opacity:.9;text-align:right}
.topbar-user small{display:block;font-size:10px;font-weight:400;opacity:.75;text-transform:uppercase;letter-spacing:.5px}

/* ── LEZIONI BANNER ── */
.lez-banner{background:var(--cl-dark);padding:10px 16px;flex-shrink:0;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.lez-banner::-webkit-scrollbar{display:none}
.lez-chip{flex:0 0 auto;background:rgba(255,255,255,.18);border-radius:20px;padding:5px 13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.lez-chip .num{font-size:15px;font-weight:700;color:#fff}
.lez-chip .tipo{font-size:11px;color:rgba(255,255,255,.85);font-weight:500}
.lez-banner-empty{font-size:12px;color:rgba(255,255,255,.7);padding:6px 0}

/* ── PULL TO REFRESH ── */
#ptr-indicator{position:fixed;top:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;background:var(--green-l);z-index:200;transition:height .2s ease;pointer-events:none}
#ptr-indicator.visible{height:56px}
#ptr-spinner{width:24px;height:24px;border:2.5px solid var(--cl-mid);border-top-color:var(--cl-dark);border-radius:50%;animation:none}
#ptr-spinner.spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ptr-label{font-size:12px;font-weight:600;color:var(--cl-dark);letter-spacing:.4px;margin-left:10px;text-transform:uppercase}

/* ── PAGES ── */
.pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--nav-h)}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;height:var(--nav-h)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border:none;background:transparent;padding:8px 4px 12px;transition:color .15s;position:relative}
.bnav-item::before{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:transparent;transition:background .15s}
.bnav-item .ti{font-size:22px;line-height:1;transition:transform .15s}
.bnav-item .ti-filled{display:none}
.bnav-item .ti-outline{display:inline}
.bnav-item.active{color:var(--cl-dark)}
.bnav-item.active::before{background:var(--cl-dark)}
.bnav-item.active .ti-filled{display:inline}
.bnav-item.active .ti-outline{display:none}
.bnav-item.active .ti{transform:scale(1.1)}

/* ── PAGE CONTENT ── */
.page{display:none;padding:0}
.page.active{display:block}

/* ── SECTION HEADER ── */
.page-header{padding:16px 16px 8px;font-size:11px;font-weight:700;color:var(--cl-dark);text-transform:uppercase;letter-spacing:.8px}

/* ── GIORNO GROUP ── */
.day-group{margin-bottom:4px}
.day-label{padding:10px 16px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0;background:var(--bg);z-index:10}
.day-label.today{color:var(--cl-dark)}
.day-label .badge-oggi{background:var(--cl-dark);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:6px;font-weight:700;letter-spacing:.3px;vertical-align:middle}

/* ── SESSION CARD ── */
.ses-card{margin:0 12px 8px;background:#fff;border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:transform .1s}
.ses-card:active{transform:scale(.99)}
.ses-card.prenotata{background:var(--green-l);border-color:var(--cl-dark);border-width:1.5px}
.ses-card.piena{opacity:.6}
.ses-card-body{padding:14px 14px 12px;display:flex;align-items:flex-start;gap:12px}
.ses-time{flex-shrink:0;text-align:center;width:44px}
.ses-time .ora{font-size:16px;font-weight:700;color:var(--cl-dark);line-height:1}
.ses-time .dot{width:8px;height:8px;border-radius:50%;margin:5px auto 0;background:var(--border)}
.ses-time .dot.ok{background:#4caf50}
.ses-time .dot.piena{background:var(--red)}
.ses-time .dot.prenotata{width:16px;height:16px;border-radius:50%;background:var(--cl-dark);display:flex;align-items:center;justify-content:center;margin:2px auto 0}
.ses-time .dot.prenotata::after{content:'✓';color:#fff;font-size:9px;font-weight:700;line-height:1}
.ses-info{flex:1;min-width:0}
.ses-tipo{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.ses-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ses-posti{font-size:12px;font-weight:600}
.ses-posti.ok{color:var(--ok)}
.ses-posti.warn{color:var(--warn)}
.ses-posti.piena{color:var(--red)}
.ses-card-footer{padding:0 14px 12px;display:flex;gap:8px}
.btn-prenota{flex:1;padding:11px;border-radius:var(--r-sm);border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-prenota.prenota{background:var(--cl-dark);color:#fff}
.btn-prenota.prenota:active{background:var(--green-d)}
.btn-prenota.piena{background:var(--bg);color:var(--muted);cursor:not-allowed}
.btn-prenota.loading{opacity:.6;pointer-events:none}
/* stato prenotata — footer con conferma + disdici discreto */
.prenotata-footer{padding:0 14px 13px;display:flex;align-items:center;justify-content:space-between}
.prenotata-label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--green-d)}
.btn-disdici-link{background:none;border:none;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;padding:4px 0;text-decoration:underline;text-underline-offset:2px;transition:color .15s}
.btn-disdici-link:hover{color:var(--red)}
.btn-disdici-link:disabled{opacity:.4;cursor:not-allowed;text-decoration:none}

/* ── PROGRESS BAR ── */
.posti-bar{height:4px;background:var(--bg);border-radius:2px;margin-top:6px;overflow:hidden;max-width:100px}
.posti-bar-fill{height:100%;border-radius:2px;transition:width .3s}

/* ── EMPTY / LOADING ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px}
.empty .ti{font-size:40px;display:block;margin-bottom:12px;color:var(--cl-light)}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:56px 20px;gap:10px;color:var(--muted);font-size:13px}
.spin{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--cl-dark);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LEZIONI PAGE ── */
.lezioni-section{padding:0 12px 12px}
.pren-card{background:#fff;border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--shadow);padding:14px;margin-bottom:8px}
.pren-card.futura{border-left:3px solid var(--cl-dark)}
.pren-card.passata{opacity:.7}
.pren-row{display:flex;justify-content:space-between;align-items:flex-start}
.pren-tipo{font-size:14px;font-weight:700;color:var(--text)}
.pren-data{font-size:12px;color:var(--muted);margin-top:2px}
.pren-stato{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px}
.pren-stato.prenotato{background:var(--green-l);color:var(--green-d)}
.pren-stato.presente{background:var(--ok-l);color:var(--ok)}
.pren-stato.cancellato{background:var(--red-l);color:var(--red)}
.storico-header{padding:16px 16px 6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

/* ── IO PAGE ── */
.io-wrap{padding:12px}
.io-card{background:#fff;border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--shadow);padding:18px;margin-bottom:10px}
.io-card h3{font-size:13px;font-weight:700;color:var(--cl-dark);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.io-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bg);font-size:14px}
.io-row:last-child{border:none}
.io-label{color:var(--muted);font-size:13px}
.io-val{font-weight:600;color:var(--text);text-align:right}
.pac-card{background:var(--green-l);border-radius:var(--r-md);padding:14px;margin-bottom:8px}
.pac-card.scaduto{background:var(--bg);opacity:.7}
.pac-nome{font-size:14px;font-weight:700;color:var(--cl-dark);margin-bottom:8px}
.pac-lez-list{display:flex;flex-direction:column;gap:6px}
.pac-lez-row{display:flex;justify-content:space-between;align-items:center}
.pac-lez-nome{font-size:13px;color:var(--text)}
.pac-lez-count{font-size:13px;font-weight:700;color:var(--cl-dark)}
.pac-prog{height:4px;background:rgba(0,0,0,.1);border-radius:2px;margin-top:4px;overflow:hidden}
.pac-prog-fill{height:100%;background:var(--cl-dark);border-radius:2px}
.cert-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.cert-ok{background:var(--ok-l);color:var(--ok)}
.cert-warn{background:var(--warn-l);color:var(--warn)}
.cert-danger{background:var(--red-l);color:var(--red)}
.logout-btn{width:100%;padding:13px;background:transparent;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;margin-top:8px}

/* ── TOAST ── */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#222;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:700;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;max-width:90vw;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--red)}

/* ── CONFIRM DIALOG ── */
#confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center}
#confirm-overlay.open{display:flex}
#confirm-box{background:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:24px 20px 40px;width:100%;max-width:480px}
#confirm-box .c-icon{font-size:30px;text-align:center;margin-bottom:8px}
#confirm-box .c-msg{font-size:16px;font-weight:700;color:var(--text);text-align:center;margin-bottom:4px}
#confirm-box .c-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5}
#confirm-box .c-btns{display:flex;gap:10px}
#confirm-box .c-btns button{flex:1;padding:13px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.c-ok{background:var(--cl-dark)!important;color:#fff!important;border-color:var(--cl-dark)!important}
.c-ok.danger{background:var(--red)!important;border-color:var(--red)!important}
.c-cancel{background:#fff;color:var(--text)}
</style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-logo">c<span></span>reline</div>
  <div class="login-sub">Pilates &amp; Fitness Studio</div>
  <div class="login-box">
    <h2>La tua area personale</h2>
    <p>Seleziona il tuo profilo per accedere</p>
    <div class="field">
      <label>Chi sei?</label>
      <select id="select-cliente">
        <option value="">— caricamento clienti… —</option>
      </select>
    </div>
    <button class="btn-login" id="btn-accedi" onclick="accedi()">Accedi →</button>
    <div class="login-note">⚠️ Modalità test — in produzione accederai via codice WhatsApp</div>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-row">
      <div class="topbar-logo">c<span></span>reline</div>
      <div class="topbar-user">
        <span id="top-nome">—</span>
        <small>La tua area · v1.3</small>
      </div>
    </div>
  </div>

  <!-- Banner lezioni disponibili -->
  <div class="lez-banner" id="lez-banner">
    <div class="lez-banner-empty">Caricamento…</div>
  </div>

  <!-- Pull to refresh indicator -->
  <div id="ptr-indicator">
    <div id="ptr-spinner"></div>
    <span id="ptr-label">Aggiorno…</span>
  </div>

  <!-- Pages -->
  <div class="pages" id="pages">

    <!-- ── BOOK ── -->
    <div class="page active" id="page-book">
      <div class="loading-wrap" id="book-loading">
        <div class="spin"></div>Caricamento sessioni…
      </div>
      <div id="book-list" style="display:none;padding:8px 0 4px"></div>
    </div>

    <!-- ── LEZIONI ── -->
    <div class="page" id="page-lezioni">
      <div class="loading-wrap" id="lez-loading">
        <div class="spin"></div>Caricamento…
      </div>
      <div id="lez-content" style="display:none"></div>
    </div>

    <!-- ── IO ── -->
    <div class="page" id="page-io">
      <div class="loading-wrap" id="io-loading">
        <div class="spin"></div>Caricamento…
      </div>
      <div id="io-content" style="display:none"></div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="bnav-item active" id="bnav-book" onclick="goPage('book')">
      <span class="ti ti-calendar-event ti-outline"></span>
      <span class="ti ti-calendar-event-filled ti-filled"></span>
      Book
    </button>
    <button class="bnav-item" id="bnav-lezioni" onclick="goPage('lezioni')">
      <span class="ti ti-list-check ti-outline"></span>
      <span class="ti ti-list-check ti-filled"></span>
      Lezioni
    </button>
    <button class="bnav-item" id="bnav-io" onclick="goPage('io')">
      <span class="ti ti-user-circle ti-outline"></span>
      <span class="ti ti-user-circle-filled ti-filled"></span>
      Io
    </button>
  </nav>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Confirm dialog -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <div class="c-icon" id="c-icon">⚠️</div>
    <div class="c-msg" id="c-msg"></div>
    <div class="c-sub" id="c-sub"></div>
    <div class="c-btns">
      <button class="c-cancel" onclick="cResolve(false)">Annulla</button>
      <button class="c-ok" id="c-ok-btn" onclick="cResolve(true)">Conferma</button>
    </div>
  </div>
</div>

<script>
const API = (window.BACKEND_URL || 'https://pilates-backend-47ys.onrender.com');
const ADMIN_TOKEN = 'test-mode'; // sostituito con token cliente in produzione
let token = '';
let clienteId = null;
let clienteData = null; // scheda completa
let sessioni = []; // sessioni aperte
let prenotazioniAttive = {}; // { tipo_lezione: sessione_id }

// ── UTILS ────────────────────────────────────────────────────────────────────
async function GET(path){
  try{
    const r = await fetch(API+path,{headers:{'X-Auth-Token':token}});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){return null;}
}

async function POST(path, body){
  try{
    const r = await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','X-Auth-Token':token},body:JSON.stringify(body)});
    return await r.json();
  }catch(e){return {error:'Errore di rete'};}
}

function toast(msg, type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(type?' '+type:'');
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2800);
}

let _cResolve=null;
function cResolve(v){
  document.getElementById('confirm-overlay').classList.remove('open');
  if(_cResolve){_cResolve(v);_cResolve=null;}
}
function confirmDialog(msg,{sub='',ok,okLabel,danger,okDanger,icon='⚠️'}={}){
  const label = okLabel||ok||'Conferma';
  const isDanger = okDanger||danger||false;
  return new Promise(res=>{
    _cResolve=res;
    document.getElementById('c-icon').textContent=icon;
    document.getElementById('c-msg').textContent=msg;
    document.getElementById('c-sub').textContent=sub;
    document.getElementById('c-sub').style.display=sub?'':'none';
    const btn=document.getElementById('c-ok-btn');
    btn.textContent=label;
    btn.className='c-ok'+(isDanger?' danger':'');
    document.getElementById('confirm-overlay').classList.add('open');
  });
}
document.getElementById('confirm-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('confirm-overlay')) cResolve(false);
});

function fmtData(s){
  if(!s) return '';
  const d=new Date(s+'T00:00:00');
  return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
}
function fmtDataShort(s){
  if(!s) return '';
  const d=new Date(s+'T00:00:00');
  return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
}
function isOggi(s){
  return s===new Date().toISOString().slice(0,10);
}
function isDomani(s){
  const d=new Date(); d.setDate(d.getDate()+1);
  return s===d.toISOString().slice(0,10);
}
function dayLabel(s){
  if(isOggi(s)) return 'Oggi';
  if(isDomani(s)) return 'Domani';
  return fmtData(s);
}

// ── LOAD APP ─────────────────────────────────────────────────────────────────
async function loadApp(){
  // Carica scheda cliente e sessioni in parallelo
  const [scheda, ses] = await Promise.all([
    GET('/api/v2/iscritte/'+clienteId+'/scheda'),
    GET('/api/v2/sessioni/aperte')
  ]);

  clienteData = scheda;
  sessioni = ses || [];

  // Calcola prenotazioni attive (sessioni future dove è prenotato)
  // Le otteniamo dalla scheda — le sessioni future nelle presenze
  // Ricarichiamo con endpoint dedicato
  const presenze = await GET('/api/v2/iscritte/'+clienteId+'/sessioni');
  prenotazioniAttive = {};
  if(presenze){
    const oggi = new Date().toISOString().slice(0,10);
    presenze
      .filter(p=>p.stato==='prenotato' && p.data >= oggi)
      .forEach(p=>{
        prenotazioniAttive[p.sessione_id] = {
          sessione_id: p.sessione_id,
          data: p.data,
          orario: p.orario,
          tipo: p.tipo
        };
      });
  }

  // Filtra sessioni: solo quelle nei prossimi 7 giorni
  const oggi = new Date();
  const fine = new Date(); fine.setDate(fine.getDate()+7);
  sessioni = sessioni.filter(s=>{
    const d = new Date(s.data+'T00:00:00');
    return d >= oggi && d <= fine;
  });

  updateTopbar();
  renderBanner();
  renderBook();
}

function updateTopbar(){
  if(!clienteData) return;
  const i = clienteData.iscritta;
  document.getElementById('top-nome').textContent = i.nome + (i.cognome?' '+i.cognome:'');
}

// ── BANNER LEZIONI ────────────────────────────────────────────────────────────
function renderBanner(){
  const banner = document.getElementById('lez-banner');
  if(!clienteData) return;
  const pacchetti = (clienteData.pacchetti||[]).filter(p=>p.stato==='attivo');

  // Raccogli tutte le lezioni abilitate con lezioni rimanenti
  const lezMap = {};
  pacchetti.forEach(p=>{
    (p.lezioni_abilitate||[]).forEach(l=>{
      const rim = l.n_lezioni - l.n_fatte;
      if(!lezMap[l.nome]) lezMap[l.nome]=0;
      lezMap[l.nome]+=Math.max(0,rim);
    });
  });

  const entries = Object.entries(lezMap);
  if(!entries.length){
    banner.innerHTML='<div class="lez-banner-empty">Nessun pacchetto attivo</div>';
    return;
  }

  banner.innerHTML = entries.map(([nome,rim])=>`
    <div class="lez-chip">
      <span class="num">${rim}</span>
      <span class="tipo">${nome}</span>
    </div>
  `).join('');
}

// ── BOOK PAGE ─────────────────────────────────────────────────────────────────
function renderBook(){
  const loading = document.getElementById('book-loading');
  const list = document.getElementById('book-list');
  loading.style.display='none';
  list.style.display='block';

  if(!sessioni.length){
    list.innerHTML='<div class="empty"><span class="ti ti-calendar-off"></span>Nessuna sessione disponibile nei prossimi 7 giorni</div>';
    return;
  }

  // Calcola lezioni compatibili con i pacchetti attivi del cliente
  const lezCompatibili = getLezCompatibili();

  // Se nessun pacchetto attivo con lezioni rimaste → messaggio dedicato
  if(!lezCompatibili.size){
    list.innerHTML='<div class="empty"><span class="ti ti-package-off"></span>Nessun pacchetto attivo.<br><span style="font-size:13px;color:var(--muted)">Contatta lo studio per rinnovare.</span></div>';
    return;
  }

  // Filtra solo sessioni compatibili con i pacchetti
  const sesFiltrate = sessioni.filter(s=> lezCompatibili.has(s.tipo));

  if(!sesFiltrate.length){
    list.innerHTML='<div class="empty"><span class="ti ti-lock"></span>Nessuna sessione compatibile con i tuoi pacchetti attivi</div>';
    return;
  }

  // Raggruppa per giorno
  const byDay = {};
  sesFiltrate.forEach(s=>{
    if(!byDay[s.data]) byDay[s.data]=[];
    byDay[s.data].push(s);
  });

  let html='';
  Object.keys(byDay).sort().forEach(data=>{
    const isToday = isOggi(data);
    html+=`<div class="day-group">
      <div class="day-label${isToday?' today':''}">
        ${dayLabel(data)}${isToday?'<span class="badge-oggi">Oggi</span>':''}
      </div>`;
    byDay[data].forEach(s=>{
      html += renderSesCard(s, lezCompatibili);
    });
    html+='</div>';
  });

  list.innerHTML=html;
}

function getLezCompatibili(){
  const s = new Set();
  if(!clienteData) return s;
  const pac = (clienteData.pacchetti||[]).filter(p=>p.stato==='attivo');
  pac.forEach(p=>{
    (p.lezioni_abilitate||[]).forEach(l=>{
      if(l.n_lezioni - l.n_fatte > 0) s.add(l.nome);
    });
  });
  return s;
}

function renderSesCard(s, lezCompatibili){
  const isPrenotata = s.id in prenotazioniAttive;
  const isPiena = s.posti_disponibili <= 0 && !isPrenotata;
  const istrLabel = s.istr ? `<span class="ti ti-user" style="font-size:11px"></span> ${s.istr}` : '';

  // Calcola se la cancellazione è possibile (>24h)
  let canDisdire = false;
  if(isPrenotata){
    const sesDatetime = new Date(s.data+'T'+(s.orario||'00:00'));
    const diffH = (sesDatetime - new Date())/3600000;
    canDisdire = diffH >= 24;
  }

  // Posti bar
  const pMax = s.posti_max||6;
  const pOcc = s.n_prenotati||0;
  const pct = Math.round((pOcc/pMax)*100);
  let postiClass = 'ok', postiLabel='';
  if(isPiena){ postiClass='piena'; postiLabel='Piena'; }
  else if(s.posti_disponibili<=2){ postiClass='warn'; postiLabel=s.posti_disponibili+' posto'+(s.posti_disponibili===1?'':'i'); }
  else { postiLabel=s.posti_disponibili+' posti liberi'; }

  let dotClass = isPrenotata?'prenotata':isPiena?'piena':'ok';
  let cardClass = isPrenotata?'prenotata':isPiena?'piena':'';

  // Pulsante
  let btnHtml='';
  if(isPrenotata){
    const disdiciHtml = canDisdire
      ? `<button class="btn-disdici-link" onclick="disdici(${s.id},this)">Disdici</button>`
      : `<button class="btn-disdici-link" disabled title="Non disdibile entro 24h">Non disdibile</button>`;
    btnHtml=`
      <div class="prenotata-footer">
        <span class="prenotata-label"><span class="ti ti-circle-check"></span> Sei prenotata</span>
        ${disdiciHtml}
      </div>`;
  } else if(isPiena){
    btnHtml=`<div class="ses-card-footer"><button class="btn-prenota piena" disabled>Sessione piena</button></div>`;
  } else {
    btnHtml=`<div class="ses-card-footer"><button class="btn-prenota prenota" onclick="prenota(${s.id},'${s.tipo||''}',this)"><span class="ti ti-calendar-plus"></span> Prenota</button></div>`;
  }

  return `<div class="ses-card ${cardClass}" id="ses-${s.id}">
    <div class="ses-card-body">
      <div class="ses-time">
        <div class="ora">${(s.orario||'—').slice(0,5)}</div>
        <div class="dot ${dotClass}"></div>
      </div>
      <div class="ses-info">
        <div class="ses-tipo">${s.tipo||'Sessione'}</div>
        <div class="ses-meta">
          ${istrLabel}
          <span class="ses-posti ${postiClass}">${postiLabel}</span>
        </div>
        ${!isPrenotata?`<div class="posti-bar"><div class="posti-bar-fill" style="width:${pct}%;background:${isPiena?'var(--red)':pct>66?'var(--warn)':'var(--ok)'}"></div></div>`:''}
      </div>
    </div>
    ${btnHtml}
  </div>`;
}

// ── PRENOTA ───────────────────────────────────────────────────────────────────
async function prenota(sid, tipo, btn){
  // Controlla se ha già una prenotazione per questo tipo di sessione
  const tipoSes = getTipoSessione(sid);

  // Trova il pacchetto giusto da usare
  const pacchetto = getPacchettoPerTipo(tipo);
  if(!pacchetto){
    toast('Nessun pacchetto attivo compatibile con questa lezione','err');
    return;
  }

  // Animazione loading
  btn.classList.add('loading');
  btn.innerHTML='<div class="spin" style="width:16px;height:16px;border-width:2px"></div>';

  const res = await POST('/api/v2/sessioni/'+sid+'/prenota',{
    iscritta_id: clienteId,
    pacchetto_id: pacchetto.id
  });

  if(res && res.ok){
    toast('Prenotazione confermata! ✓','ok');
    await reload();
  } else {
    btn.classList.remove('loading');
    btn.innerHTML='<span class="ti ti-calendar-plus"></span> Prenota';
    toast(res?.error||'Errore durante la prenotazione','err');
  }
}

// ── DISDICI ───────────────────────────────────────────────────────────────────
async function disdici(sid, btn){
  const ok = await confirmDialog('Disdire questa sessione?',{
    sub:'La tua lezione verrà ripristinata nel pacchetto.',
    icon:'🗑️', okLabel:'Disdici', okDanger:true
  });
  if(!ok) return;

  btn.classList.add('loading');
  btn.innerHTML='<div class="spin" style="width:16px;height:16px;border-width:2px"></div>';

  const res = await POST('/api/v2/sessioni/'+sid+'/cancella',{
    iscritta_id: clienteId,
    cancellato_da: 'cliente'
  });

  if(res && res.ok){
    toast('Prenotazione disdetta','ok');
    await reload();
  } else {
    btn.classList.remove('loading');
    btn.innerHTML='<span class="ti ti-x"></span> Disdici';
    toast(res?.error||'Errore durante la disdetta','err');
  }
}

function getTipoSessione(sid){
  const s = sessioni.find(x=>x.id===sid);
  return s?.tipo_sessione||'gruppo';
}

function getPacchettoPerTipo(tipoLezione){
  if(!clienteData) return null;
  const pac = (clienteData.pacchetti||[]).filter(p=>p.stato==='attivo');
  // Trova il primo pacchetto con lezioni rimaste per questo tipo
  for(const p of pac){
    const lez = (p.lezioni_abilitate||[]).find(l=>l.nome===tipoLezione && (l.n_lezioni-l.n_fatte)>0);
    if(lez) return p;
  }
  return null;
}

async function reload(){
  await loadApp();
  // Mantieni la pagina corrente
  const cur = document.querySelector('.page.active')?.id?.replace('page-','');
  if(cur==='lezioni') renderLezioni();
  else if(cur==='io') renderIo();
  else renderBook();
}

// ── LEZIONI PAGE ──────────────────────────────────────────────────────────────
async function loadLezioni(){
  const loading = document.getElementById('lez-loading');
  const content = document.getElementById('lez-content');
  loading.style.display='flex';
  content.style.display='none';

  const data = await GET('/api/v2/iscritte/'+clienteId+'/sessioni');
  loading.style.display='none';
  content.style.display='block';

  if(!data || !data.length){
    content.innerHTML='<div class="empty"><span class="ti ti-list-check"></span>Nessuna lezione ancora</div>';
    return;
  }

  const oggi = new Date().toISOString().slice(0,10);
  const future = data.filter(p=>p.data>=oggi && p.stato==='prenotato');
  const passate = data.filter(p=>p.data<oggi || p.stato!=='prenotato');

  let html='';
  if(future.length){
    html+='<div class="page-header">Prossime lezioni</div><div class="lezioni-section">';
    future.forEach(p=>{
      html+=`<div class="pren-card futura">
        <div class="pren-row">
          <div>
            <div class="pren-tipo">${p.tipo||'Sessione'}</div>
            <div class="pren-data">${dayLabel(p.data)} · ${(p.orario||'').slice(0,5)}</div>
          </div>
          <span class="pren-stato prenotato">Prenotata</span>
        </div>
      </div>`;
    });
    html+='</div>';
  }

  if(passate.length){
    html+='<div class="storico-header">Storico</div><div class="lezioni-section">';
    passate.slice(0,30).forEach(p=>{
      const stato = p.stato==='cancellato'?'cancellato':p.stato==='presente'?'presente':null;
      const badgeHtml = stato
        ? `<span class="pren-stato ${stato}">${stato==='cancellato'?'Disdetta':'Presente'}</span>`
        : '';
      html+=`<div class="pren-card passata">
        <div class="pren-row">
          <div>
            <div class="pren-tipo">${p.tipo||'Sessione'}</div>
            <div class="pren-data">${fmtDataShort(p.data)} · ${(p.orario||'').slice(0,5)}</div>
          </div>
          ${badgeHtml}
        </div>
      </div>`;
    });
    html+='</div>';
  }

  content.innerHTML=html;
}

function renderLezioni(){
  loadLezioni();
}

// ── IO PAGE ───────────────────────────────────────────────────────────────────
function renderIo(){
  const loading = document.getElementById('io-loading');
  const content = document.getElementById('io-content');

  content.style.display='block';

  if(!clienteData){
    content.innerHTML='<div class="empty">Dati non disponibili</div>';

  const i = clienteData.iscritta;
  const pacchetti = (clienteData.pacchetti||[]).filter(p=>p.stato==='attivo');
  const pachettiStorico = (clienteData.pacchetti||[]).filter(p=>p.stato!=='attivo');
  const saldare = (clienteData.movimenti||[]).filter(m=>m.importo<0);

  // Certificato medico
  const certMap = {
    'valido':'<span class="cert-badge cert-ok">✓ Certificato valido</span>',
    'in scadenza':'<span class="cert-badge cert-warn">⚠ In scadenza</span>',

    'non presentato':'<span class="cert-badge cert-danger">✗ Non presentato</span>',
    'in attesa approvazione':'<span class="cert-badge cert-warn">⌛ In approvazione</span>'
  };
  const certBadge = certMap[i.cert_medico_stato]||certMap['non presentato'];

  let html=`<div class="io-wrap">`;

  // Dati personali
  html+=`<div class="io-card">
    <h3>I tuoi dati</h3>
    <div class="io-row"><span class="io-label">Nome</span><span class="io-val">${i.nome} ${i.cognome||''}</span></div>
    ${i.telefono?`<div class="io-row"><span class="io-label">Telefono</span><span class="io-val">${i.telefono}</span></div>`:''}
    ${i.email?`<div class="io-row"><span class="io-label">Email</span><span class="io-val">${i.email}</span></div>`:''}
    <div class="io-row"><span class="io-label">Certificato medico</span><span class="io-val">${certBadge}</span></div>
    ${i.cert_medico_scadenza?`<div class="io-row"><span class="io-label">Scadenza cert.</span><span class="io-val">${fmtDataShort(i.cert_medico_scadenza)}</span></div>`:''}
  </div>`;

  // Pacchetti attivi
  if(pacchetti.length){
    html+=`<div class="io-card"><h3>I tuoi pacchetti</h3>`;
    pacchetti.forEach(p=>{
      const lezHtml = (p.lezioni_abilitate||[]).map(l=>{
        const rim=Math.max(0,l.n_lezioni-l.n_fatte);
        const pct=Math.round((l.n_fatte/l.n_lezioni)*100)||0;
        return `<div class="pac-lez-row">
          <span class="pac-lez-nome">${l.nome}</span>
          <span class="pac-lez-count">${rim} / ${l.n_lezioni}</span>
        </div>
        <div class="pac-prog"><div class="pac-prog-fill" style="width:${pct}%"></div></div>`;
      }).join('');
      html+=`<div class="pac-card">
        <div class="pac-nome">${p.corso_nome||'Pacchetto'}</div>
        <div class="pac-lez-list">${lezHtml||'<div style="font-size:13px;color:var(--muted)">Nessuna lezione nel pacchetto</div>'}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Storico pacchetti
  if(pachettiStorico.length){
    html+=`<div class="io-card"><h3>Storico pacchetti</h3>`;
    pachettiStorico.forEach(p=>{
      const lezTot = (p.lezioni_abilitate||[]).reduce((s,l)=>s+l.n_lezioni,0);
      const lezFatte = (p.lezioni_abilitate||[]).reduce((s,l)=>s+l.n_fatte,0);
      const statoLabel = p.stato==='esaurito'?'Esaurito':p.stato==='scaduto'?'Scaduto':'Terminato';
      html+=`<div class="io-row">
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text)">${p.corso_nome||'Pacchetto'}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${p.data_inizio?fmtDataShort(p.data_inizio):''} · ${lezFatte}/${lezTot} lezioni</div>
        </div>
        <span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--bg);color:var(--muted)">${statoLabel}</span>
      </div>`;
    });
    html+=`</div>`;
  }

  // Da saldare
  if(saldare.length){
    html+=`<div class="io-card" style="border-color:var(--warn)">
      <h3 style="color:var(--warn)">Da saldare</h3>`;
    saldare.forEach(m=>{
      html+=`<div class="io-row">
        <span class="io-label">${m.descrizione||m.nota||'Pagamento'}</span>
        <span class="io-val" style="color:var(--warn)">€${Math.abs(m.importo).toFixed(2)}</span>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`<button class="logout-btn" onclick="logout()"><span class="ti ti-logout"></span> Esci</button>`;
  html+=`</div>`;

  content.innerHTML=html;
}

// ── PULL TO REFRESH ───────────────────────────────────────────────────────────
(function(){
  const THRESHOLD = 70; // px di pull per triggerare
  let startY = 0, pulling = false, triggered = false;
  const pages = document.getElementById('pages');
  const ind = document.getElementById('ptr-indicator');
  const spinner = document.getElementById('ptr-spinner');
  const label = document.getElementById('ptr-label');

  pages.addEventListener('touchstart', e=>{
    if(pages.scrollTop === 0) { startY = e.touches[0].clientY; pulling = true; triggered = false; }
  }, {passive:true});

  pages.addEventListener('touchmove', e=>{
    if(!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0){ pulling=false; return; }
    if(dy > THRESHOLD && !triggered){
      ind.classList.add('visible');
      label.textContent = 'Rilascia per aggiornare';
    } else if(dy <= THRESHOLD){
      ind.classList.add('visible');
      label.textContent = 'Tira per aggiornare';
    }
  }, {passive:true});

  pages.addEventListener('touchend', async ()=>{
    if(!pulling) return;
    pulling = false;
    if(!ind.classList.contains('visible')){ return; }
    // Avvia refresh
    label.textContent = 'Aggiorno…';
    spinner.classList.add('spin');
    triggered = true;
    try {
      if(clienteId) await loadApp();
      // Aggiorna anche la pagina corrente se non è book
      const activePage = document.querySelector('.page.active');
      if(activePage && activePage.id==='page-lezioni') await loadLezioni();
      if(activePage && activePage.id==='page-io') renderIo();
    } finally {
      spinner.classList.remove('spin');
      ind.classList.remove('visible');
    }
  });
})();

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function goPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('bnav-'+p).classList.add('active');
  if(p==='lezioni') renderLezioni();
  if(p==='io') renderIo();
}

function logout(){
  clienteId=null; clienteData=null; sessioni=[]; prenotazioniAttive={};
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('select-cliente').value='';
  document.getElementById('lez-banner').innerHTML='<div class="lez-banner-empty">Caricamento…</div>';
  document.getElementById('book-loading').style.display='flex';
  document.getElementById('book-list').style.display='none';
  document.getElementById('lez-loading').style.display='flex';
  document.getElementById('lez-content').style.display='none';
  document.getElementById('io-loading').style.display='flex';
  document.getElementById('io-content').style.display='none';
  goPage('book');
}
